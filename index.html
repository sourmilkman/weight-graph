<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-actions">
            <!-- New Button for setting Goal -->
            <button id="set-goal-btn" class="icon-btn" title="Set Goal">🎯</button>
            <button id="add-weight-btn" class="icon-btn" title="Add Weight">➕</button>
        </div>
        <div class="header-title">Weight Tracker</div>
    </div>

    <div class="main-container">
        <div class="stats-card">
            <div class="stat-item">
                <span class="stat-label">Current</span>
                <span id="current-weight-display" class="stat-value">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Goal</span>
                <span id="goal-weight-display" class="stat-value">--</span>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="weightChart"></canvas>
        </div>

        <div class="history-section">
            <h3>History</h3>
            <ul id="history-list"></ul>
        </div>
    </div>

    <!-- Modal for Input -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Add Weight</h2>
            <p id="modal-desc">Enter your current weight.</p>
            <input type="number" id="modal-input" step="0.1" placeholder="0.0">
            <div class="modal-actions">
                <button id="modal-cancel" class="btn-secondary">Cancel</button>
                <button id="modal-save" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
