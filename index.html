<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracker Pro</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --primary: #00adb5;
            --text: #eeeeee;
            --text-dim: #b0b0b0;
            --accent: #ff2e63;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            box_shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
        }

        /* Input Section */
        .input-group {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-string: var(--primary);
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.8; }

        /* History List */
        .history-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.95rem;
        }

        .log-date { color: var(--text-dim); }
        .log-weight { font-weight: bold; }

        .empty-msg {
            text-align: center;
            color: var(--text-dim);
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Weight Tracker</h1>

    <!-- Top Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">Current</span>
            <span id="displayCurrent" class="stat-value">--</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Goal</span>
            <span id="displayGoal" class="stat-value">--</span>
        </div>
    </div>

    <!-- Form -->
    <div classmode="input-group">
        <label for="weightInput">Add Weight (e.g., 12.10 for 12st 10lb)</label>
        <input type="number" id="weightInput" step="0.01" placeholder="0.00">
        
        <label for="goalInput">Set Goal Weight (e.g., 10.00)</label>
        <input type="number" id="goalInput" step="0.01" placeholder="Target Weight">
        
        <button onclick="handleUpdate()">Update Tracker</button>
    </div>

    <!-- History -->
    <div class="history-title">Weight History</div>
    <div id="historyList">
        <div class="empty-msg">No entries yet.</div>
    </div>
</div>

<script>
    // App State
    let state = {
        currentWeightPounds: 0,
        goalWeightPounds: 0,
        history: [] // Array of { date: string, lbs: number }
    };

    // Load from LocalStorage on startup
    function init() {
        const saved = localStorage.getItem('weightTrackerData');
        if (saved) {
            state = JSON.parse(saved);
            render();
        }
    }

    // CORE LOGIC: Convert "12.10" notation to total pounds
    function parseStoneNotation(val) {
        if (val === null || isNaN(val)) return 0;
        
        const stones = Math.floor(val);
        // We get the decimal part and convert it to an integer (e.g., .10 -> 10)
        // We use round to avoid floating point math errors (0.1 * 100 = 9.9999)
        const pounds = Math.round((val - stones) * 100);
        
        return (stones * 14) + pounds;
    }

    // CORE LOGIC: Convert total pounds back to "12.10" notation
    function formatStoneNotation(totalLbs) {
        if (totalLbs <= 0) return "--";
        
        const stones = Math.floor(totalLbs / 14);
        const pounds = total_lbs_to_lbs_remainder(totalLbs); 
        // Logic: 174 lbs -> 174 % 14 = 4. 
        // To get .04, we divide by 100.
        const remainder = totalLbs % 14;
        
        // Format decimal part to always show two digits (e.g., 5 becomes 05)
        const poundsStr = remainder.toString().padStart(2, '0');
        return `${stones}.${poundsStr}`;
    }
    
    // Helper for the formatting logic
    function total_lbs_to_lbs_remainder(lbs) {
        return lbs % 14;
    }

    function handleUpdate() {
        const weightVal = document.getElementById('weightInput').value;
        const goalVal = document.getElementById('goalInput').value;

        if (weightVal === "") {
            alert("Please enter a weight value.");
            return;
        }

        // 1. Parse the new weight
        const newWeightLbs = parseStoneNotation(parseFloat(weightVal));
        const newGoalLbs = goalVal ? parseStoneNotation(parseFloat(goalVal)) : state.goalWeightPounds;

        // 2. Update State
        const timestamp = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        
        state.currentWeightPounds = newWeightLbs;
        state.goalWeightPounds = newGoalLbs;
        
        // Add to history
        state.history.unshift({
            date: timestamp,
            lbs: newWeightLbs
        });

        // 3. Limit history to last 10 entries
        if (state.history.length > 10) state.history.pop();

        // 4. Save and Render
        save();
        render();

        // Clear inputs
        document.getElementById('weightInput').value = "";
    }

    function save() {
        localStorage.setItem('weightTrackerData', JSON.stringify(state));
    }

    function render() {
        // Update Top Stats
        document.getElementById('displayCurrent').innerText = formatStoneNotation(state.currentWeightPounds);
        document.getElementById('displayGoal').innerText = formatStoneNotation(state.goalWeightPounds);

        // Update History List
        const listContainer = document.getElementById('historyList');
        
        if (state.history.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg">No entries yet.</div>';
            return;
        }

        listContainer.innerHTML = state.history.map(item => `
            <div class="log-item">
                <span class="log-date">${item.date}</span>
                <span class="log-weight">${formatStoneNotation(item.lbs)}</span>
            </div>
        `).join('');
    }

    // Initialize the app
    init();
</script>

</body>
</html>
