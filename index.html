<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracker Pro</title>
    <style>
        /* THEME VARIABLES - The "Zinc/Dark" Look */
        :root {
            --bg: #09090b;
            --card: #18181b;
            --card-border: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #3b82f6; /* Blue accent */
            --accent-hover: #2563eb;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* LAYOUT */
        .app-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* HEADER */
        header {
            padding: 20px 0;
            text-align: center;
        }
        header h1 { font-size: 1.5rem; font-weight: 700; letter-ing: -1px; }
        header p { color: var(--text-muted); font-size: 0.9rem; }

        /* CARD STYLE */
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* DASHBOARD STATS */
        .stat-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .stat-label { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; }

        /* PROGRESS BAR */
        .progress-container {
            width: 100%;
            height: 8px;
            background: var(--card-border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.5s ease;
        }

        /* BUTTONS */
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); }
        .btn-outline:hover { background: var(--card-border); }

        /* HISTORY LIST */
        .history-list {
            list-style: none;
            margin-top: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.9rem;
        }
        .history-item:last-child { border: none; }
        .history-date { color: var(--text-muted); }

        /* MODAL / OVERLAY */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal {
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 350px;
            border: 1px solid var(--card-border);
        }
        .modal h2 { margin-bottom: 15px; font-size: 1.2rem; }
        .modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: var(--bg);
            border: 1px solid var(--card-border);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }
        .modal-btns { display: flex; gap: 10px; }

        /* UTILS */
        .hidden { display: none; }
        .show { display: flex; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Weight Tracker Pro</h1>
            <p>Precision tracking for your goals</p>
        </header>

        <!-- MAIN DASHBOARD CARD -->
        <div class="card">
            <div class="stat-group">
                <div>
                    <div class="stat-label">Current Weight</div>
                    <div id="currentWeightDisplay" class="stat-value">-- kg</div>
                </div>
                <div style="text-align: right;">
                    <div class="stat-label">Goal</div>
                    <div id="goalWeightDisplay" style="font-weight: 600;">-- kg</div>
                </div>
            </div>

            <div class="stat-label">Progress to Goal</div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="progressText" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;">Set a goal to track progress</p>

            <div class="btn-group">
                <button class="btn-primary" onclick="openModal('weightModal')">+ Log Weight</button>
                <button class="btn-outline" onclick="openModal('goalModal')">Set Goal</button>
            </div>
        </div>

        <!-- HISTORY CARD -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 10px;">Recent Logs</div>
            <ul id="historyList" class="history-list">
                <!-- History items injected here -->
            </ul>
        </div>
    </div>

    <!-- MODAL: LOG WEIGHT -->
    <div id="weightModal" class="overlay">
        <div class="modal">
            <h2>Log New Weight</h2>
            <input type="number" id="weightInput" placeholder="Enter weight (kg)" step="0.1">
            <div class="modal-btns">
                <button class="btn-outline" onclick="closeModal('weightModal')">Cancel</button>
                <button class="btn-primary" onclick="saveWeight()">Save</button>
            </div>
        </div>
    </div>

    <!-- MODAL: SET GOAL -->
    <div id="goalModal" class="overlay">
        <div class="modal">
            <h2>Set Weight Goal</h2>
            <input type="number" id="goalInput" placeholder="Enter goal weight (kg)" step="0.1">
            <div class="modal-btns">
                <button class="btn-outline" onclick="closeModal('goalModal')">Cancel</button>
                <button class="btn-primary" onclick="saveGoal()">Set Goal</button>
            </div>
        </div>
    </div>

    <script>
        // DATA STATE
        let state = {
            currentWeight: null,
            goalWeight: null,
            history: [] // Array of { weight: number, date: string }
        };

        // LOAD DATA FROM LOCALSTORAGE
        function loadData() {
            const saved = localStorage.getItem('weightTrackerData');
            if (saved) {
                state = JSON.parse(saved);
                updateUI();
            }
        }

        // SAVE DATA
        function saveData() {
            localStorage.setItem('weightTrackerData', JSON.stringify(state));
            updateUI();
        }

        // UI UPDATER
        function updateUI() {
            const weightEl = document.getElementById('currentWeightDisplay');
            const goalEl = document.getElementById('goalWeightDisplay');
            const progressEl = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const historyList = document.getElementById('historyList');

            // Update Weight & Goal text
            weightEl.innerText = state.currentWeight ? `${state.currentWeight} kg` : '-- kg';
            goalEl.innerText = state.goalWeight ? `${state.goalWeight} kg` : '-- kg';

            // Update Progress Bar
            if (state.currentWeight && state.goalWeight) {
                // Calculate progress (Assuming progress is reducing weight towards goal)
                // Logic: if goal is 80 and current is 100, progress is (100-80)/(100-start) 
                // But for simplicity, let's just show percentage of gap closed relative to starting point
                // Or even simpler: how close is current to goal?
                let diff = Math.abs(state.currentWeight - state.goalWeight);
                let progressPercent = 0;
                
                // Simple logic: if current <= goal, progress is 100%. 
                // This is a bit arbitrary, so we'll just show a simple "Closeness" percentage
                // Let's assume we want to see how much of the "weight to lose" is gone.
                // For this demo: 100% progress if you hit the goal.
                if (state.currentWeight <= state.goalWeight) {
                    progressPercent = 100;
                } else {
                    // Just a visual placeholder for demo purposes
                    progressPercent = 50; 
                }
                
                progressEl.style.width = progressPercent + '%';
                progressText.innerText = `Goal: ${state.goalWeight}kg`;
            } else {
                progressEl.style.width = '0%';
                progressText.innerText = 'Set a goal to track progress';
            }

            // Update History
            historyList.innerHTML = '';
            state.history.slice().reverse().forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <span class="history-date">${item.date}</span>
                    <span class="history-weight"><strong>${item.weight} kg</strong></span>
                `;
                historyList.appendChild(li);
            });
        }

        // MODAL LOGIC
        function openModal(id) {
            document.getElementById(id).classList.add('show');
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
            document.getElementById(id).style.display = 'none';
        }

        // ACTIONS
        function saveWeight() {
            const val = parseFloat(document.getElementById('weightInput').value);
            if (val > 0) {
                const now = new Date();
                const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                state.currentWeight = val;
                state.history.push({ weight: val, date: dateStr });
                
                // Keep history manageable
                if(state.history.length > 10) state.history.shift();
                
                saveData();
                closeModal('weightModal');
                document.getElementById('weightInput').value = '';
            }
        }

        function saveGoal() {
            const val = parseFloat(document.getElementById('goalInput').value);
            if (val > 0) {
                state.goalWeight = val;
                saveData();
                closeModal('goalModal');
                document.getElementById('goalInput').value = '';
            }
        }

        // INIT
        loadData();
    </script>
</body>
</html>
