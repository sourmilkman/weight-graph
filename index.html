<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracker Pro</title>
    <style>
        /* ALL YOUR CSS GOES HERE */
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 { margin: 0 0 10px 0; font-size: 24px; color: var(--accent); }
        p { color: var(--text-dim); margin-bottom: 30px; }

        .weight-display {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 30px;
            color: var(--text);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            background: #334155;
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); }

        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: translateY(-2px); opacity: 0.9; }
        
        .history {
            margin-top: 20px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <div classs="card">
            <div class="card">
                <h1>Weight Tracker</h1>
                <p>Track your progress daily</p>
                
                <div class="weight-display" id="currentWeight">--.-<span style="font-size: 20px; color: var(--text-dim);">kg</span></div>

                <div class="input-group">
                    <input type="number" id="weightInput" placeholder="Enter weight (kg)" step="0.1">
                    <button onclick="updateWeight()">Update Weight</button>
                    <button onclick="resetWeight()" style="background: transparent; color: var(--text-dim); font-size: 12px;">Reset</button>
                </div>

                <div class="history" id="historyList">
                    <!-- History entries appear here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ALL YOUR JS GOES HERE
        let history = JSON.parse(localStorage.getItem('weightHistory')) || [];

        function updateWeight() {
            const input = document.util = document.getElementById('weightInput');
            const val = parseFloat(input.value);

            if (isNaN(val) || val <= 0) {
                alert("Please enter a valid weight");
                return;
            }

            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Add to history
            history.unshift({ weight: val, time: timestamp });
            if (history.length > 5) history.pop(); // Keep only last 5

            // Save and Update UI
            localStorage.setItem('weightHistory', JSON.stringify(history));
            render();
            input.value = '';
        }

        function resetWeight() {
            history = [];
            localStorage.removeItem('weightHistory');
            render();
        }

        function render() {
            const display = document.getElementById('currentWeight');
            const list = document.getElementById('historyList');

            if (history.length > 0) {
                display.innerHTML = `${history[0].weight}<span style="font-size: 20px; color: var(--text-dim);">kg</span>`;
            } else {
                display.innerHTML = `--.-<span style="font-size: 20px; color: var(--text-dim);">kg</span>`;
            }

            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <span>${item.weight} kg</span>
                    <span style="color: var(--text-dim)">${item.time}</span>
                </div>
            `).join('');
        }

        // Initial Load
        render();
    </script>
</body>
</html>
