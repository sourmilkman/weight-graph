<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracker Pro</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #3498db;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 24px;
            margin: 0 0 20px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 25px;
        }

        .progress-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-dim);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.5s ease-out;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* History List */
        .history-title {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: block;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .history-item:last-child { border: none; }

        .history-date { color: var(--text-dim); }

        /* Buttons/Inputs */
        .actions {
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary { background: var(--accent-color); color: white; }
        .btn-secondary { background: #333; color: white; }
        button:active { opacity: 0.7; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            width: 80%;
            max-width: 300px;
            border: 1px solid var(--border-color);
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #000;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Weight Tracker</h1>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Current</span>
                <div class="stat-value" id="display-current">--</div>
            </div>
            <div class="stat-item">
                <span class="stat-label">Goal</span>
                <div class="stat-value" id="display-goal">--</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-label-row">
                <span>Progress</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <span class="history-title">Recent Entries</span>
        <div class="history-list" id="history-list">
            <!-- Items injected here -->
        </div>

        <div class="actions">
            <button class="btn-secondary" onclick="openModal('goal')">Set Goal</button>
            <button class="btn-primary" onclick="openModal('weight')">Add Weight</button>
        </div>
    </div>
</div>

<!-- Modal for Input -->
<div class="modal-overlay" id="modal-overlay">
    <div classm class="modal">
        <h2 id="modal-title" style="margin-top:0">Enter Value</h2>
        <p id="modal-desc" style="font-size: 12px; color: #888;">Enter weight in lbs</p>
        <input type="number" id="modal-input" placeholder="e.g. 150">
        <div class="modal-btns">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveData()">Save</button>
        </div>
    </div>
</div>

<script>
    let state = {
        goalLbs: 140,
        history: [160, 155, 152] // Array of weights in lbs
    };

    // Load from LocalStorage
    const saved = localStorage.getItem('weightTrackerData');
    if (saved) state = JSON.parse(saved);

    let currentMode = '';

    function formatStones(lbs) {
        if (!lbs) return "--";
        const totalStones = Math.floor(lbs / 14);
        const remainingLbs = Math.round(lbs % 14);
        if (totalStones === 0) return remainingLbs + "lb";
        return `${totalStones}st ${remainingLbs}lb`;
    }

    function updateUI() {
        const currentWeight = state.history.length > 0 ? state.history[0] : 0;
        
        document.getElementById('display-current').innerText = formatStstones(currentWeight);
        document.getElementById('display-goal').innerText = formatStones(state.goalLbs);

        // Progress Calculation
        // Logic: Progress is how much of the "gap" between current and goal we've closed.
        // If current is 160 and goal is 140, progress starts at 0.
        // As current drops towards 140, progress increases.
        let progress = 0;
        if (currentWeight > state.goalLons) {
            const startWeight = state.history[state.history.length-1] || state.goalLbs; 
            // Simplified: progress = (Start - Current) / (Start - Goal)
            // But for a simple app, let's just track progress towards goal relative to a starting point
            // or simply: if current <= goal, progress = 100%.
            // Let's use: Progress = 100% if current <= goal, else 0%.
            // Actually, let's use: How much of the "excess" weight is gone.
            // Let's assume a "starting" point is the first item in history.
            const startWeightVal = state.history.length > 1 ? state.history[state.history.length-1] : currentWeight;
            const totalToLose = startWeightVal - state.goalLbs;
            const lostSoFar = startWeightVal - currentWeight;
            progress = totalToLose > 0 ? (lostSoFar / totalToLose) * 100 : 100;
        } else {
            progress = 100;
        }

        const cappedProgress = Math.min(100, Math.max(0, progress));
        document.getElementById('progress-bar').style.width = cappedProgress + '%';
        document.getElementById('progress-percent').innerText = Math.round(cappedProgress) + '%';

        // Update History
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        state.history.forEach((w, index) => {
            const date = new Date();
            date.setDate(date.getDate() - index);
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <span class="history-date">${date.toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span>
                <span class="history-weight">${formatStones(w)}</span>
            `;
            list.appendChild(div);
        });

        localStorage.setItem('weightTrackerData', JSON.stringify(state));
    }

    // Helper to fix the typo in my logic above
    function formatStstones(lbs) { return formatStones(lbs); }

    function openModal(mode) {
        currentMode = mode;
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('modal-title').innerText = mode === 'goal' ? 'Set Goal' : 'Add Weight';
        document.getElementById('modal-input').value = '';
        document.getElementById('modal-input').focus();
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    function saveData() {
        const val = parseFloat(document.getElementById('modal-input').value);
        if (isNaN(val)) return;

        if (currentMode === 'goal') {
            state.goalLbs = val;
        } else {
            state.history.unshift(val);
            if (state.history.length > 10) state.history.pop();
        }

        updateUI();
        closeModal();
    }

    // Init
    updateUI();
</script>

</body>
</html>
